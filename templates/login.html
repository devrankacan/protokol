<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genexa CRO — Giriş</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="/static/images/logo.png" class="auth-logo-img" alt="Genexa CRO">
      </div>

      <div class="auth-divider"></div>

      <h2 class="auth-title">Sisteme Giriş</h2>
      <p class="auth-desc">Protokol analiz platformuna erişmek için şifrenizi girin.</p>

      {% if error %}
      <div class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="post" class="auth-form">
        <div class="form-group">
          <label for="password" class="form-label">Şifre</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Şifrenizi girin"
              required
              autofocus
            >
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
          Giriş Yap
        </button>
      </form>
    </div>

    <p class="auth-footer">© 2024 Genexa CRO — Tüm hakları saklıdır</p>
  </div>
</body>
</html>
